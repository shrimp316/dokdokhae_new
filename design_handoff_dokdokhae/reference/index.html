<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  @keyframes ddFade { from { opacity: 0 } to { opacity: 1 } }

  /* Responsive overrides — keep inline styles for desktop, collapse on mobile. */
  @media (max-width: 820px) {
    .dd-page         { padding: 24px 18px 56px !important; gap: 32px !important; }
    .dd-header       { padding: 14px 18px 12px 56px !important; }
    .dd-home-hero    { grid-template-columns: 1fr !important; gap: 22px !important; }
    .dd-home-bottom  { grid-template-columns: 1fr !important; gap: 28px !important; }
    .dd-detail-hero  { grid-template-columns: 120px 1fr !important; gap: 20px !important; }
    .dd-meet-grid    { grid-template-columns: 1fr !important; gap: 24px !important; }
    .dd-books-head   { flex-direction: column; align-items: flex-start !important; gap: 14px; }
    .dd-books-head input { min-width: 0 !important; width: 100% !important; }
    .dd-shelf-mag    { grid-template-columns: repeat(2, 1fr) !important; gap: 28px 18px !important; }
    .dd-shelf-night  { grid-template-columns: repeat(2, 1fr) !important; gap: 28px 18px !important; }
  }

  /* Direct-edit overrides land here */
</style>
